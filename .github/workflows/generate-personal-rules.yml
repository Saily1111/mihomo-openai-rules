name: Generate personal rules

on:
  push:
    branches: [main]
    paths:
      - personal/personal-rules.yaml
      - personal/scripts/generate-rules.py
      - .github/workflows/generate-personal-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-personal-rules-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate and generate rule file
        working-directory: personal
        run: |
          python scripts/generate-rules.py
          python scripts/generate-rules.py --check

      - name: Commit generated file only
        shell: bash
        run: |
          set -euo pipefail
          git add -- personal/rules/stable-ip.yaml personal/rules/vps-socks.yaml
          if git diff --cached --quiet; then
            echo "Generated file is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate personal rule set'
          git push origin HEAD:main
